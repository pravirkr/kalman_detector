[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "kalman_detector"
version = "0.5.0"
description = "Detecting Fast Radio Bursts with Spectral Structures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pravir Kumar", email = "pravirka@gmail.com" },
    { name = "Barak Zackay", email = "bzackay@gmail.com" },
]
maintainers = [{ name = "Pravir Kumar", email = "pravirka@gmail.com" }]
requires-python = ">=3.12"
keywords = [
    "fast radio bursts",
    "radio astronomy",
    "single pulse",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "scipy>=1.13",
    "matplotlib>=3.10",
    "rich>=13.0",
    "sympy",
]

[project.urls]
Repository = "https://github.com/pravirkr/kalman_detector"
Issues = "https://github.com/pravirkr/kalman_detector/issues"
Changelog = "https://github.com/pravirkr/kalman_detector/blob/main/CHANGELOG.md"

[dependency-groups]
tests = [
    "pytest>=9.0",
    "pytest-cov",
    "pytest-randomly",
    "pytest-sugar",
]
dev = [
    { include-group = "tests" },
    "ruff",
    "ty",
    "pre-commit",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "kalman_detector"
module-root = "src"

[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "src/**/*.pyi",
    "tests/**/*.py",
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D1", "D301", "PLR2004", "G004", "PLC0415"]

[tool.ruff.lint.pylint]
max-args = 15

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/kalman_detector/svm.py" = ["N806"]
"tests/**/*.py" = ["S101", "FBT", "PLR2004", "PT011", "SLF001", "N806"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ty.rules]
not-iterable = "ignore" # Numba prange and some ndarray protocols

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
omit = ["tests/*", "docs/*", "*__init__.py", "*/kalman_detector/efficiency.py"]

[tool.coverage.report]
show_missing = true
#fail_under = 85
ignore_errors = true
exclude_lines = [
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if __name__ == "__main__":',
    'if outfile_name is None:',
]
